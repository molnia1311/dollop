apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: backup
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - backup
  task: backup
  cron: "0 0 * * *"
  retain: 7
  concurrency: 1
  parameters:
    full-backup-interval: "7"
