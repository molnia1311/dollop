kind: Pod
apiVersion: v1
metadata:
  name: my-csi-app
  annotations:
    argocd.argoproj.io/sync-options: Skip
spec:
  containers:
    - name: my-frontend
      image: busybox
      volumeMounts:
        - mountPath: "/data"
          name: seaweedfs-volume
      command: [ "sleep", "1000000" ]
  volumes:
    - name: seaweedfs-volume
      persistentVolumeClaim:
        claimName: seaweedfs-csi-pvc
