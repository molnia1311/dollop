apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
  - repoURL: 'https://kubernetes.github.io/ingress-nginx'
    chart: ingress-nginx
    targetRevision: 4.11.2
    helm:
      values: |
        controller:
          kind: DaemonSet
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          admissionWebhooks:
            enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ingress-nginx
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
